name: LMS Course Architecture and Public Export Privacy CI

on:
  push:
    branches: ['main', 'fix/postmerge-prototype-ci-and-visibility-20261014']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: lms-fe-prototype-${{ github.ref }}
  cancel-in-progress: true

# Validate MDX authoring and scan the actual public export. Authentication,
# backend authorization, Studio attestations and learner state remain prototypes.
jobs:
  prototype-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked compiler and test dependencies
        run: npm ci --no-audit --no-fund
      - name: Check course architecture, privacy negatives and prototype contracts
        run: npm test

  frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact prototype dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Validate all source content and prepare public-only data before typecheck
        run: npm run typecheck
      - name: Lint maintained source
        run: npm run lint
      - name: Compile exported frontend and scan every public asset
        run: npm run build
      - name: Verify bounded prototype public routes
        run: node scripts/verify-prototype-export.mjs
