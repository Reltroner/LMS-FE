name: LMS Prototype Frontend Build and Scoped Privacy CI

on:
  push:
    branches: ['main', 'fix/postmerge-prototype-ci-and-visibility-20261014']
  pull_request:
    branches: ['main']

permissions:
  contents: read

concurrency:
  group: lms-fe-prototype-${{ github.ref }}
  cancel-in-progress: true

# This replaces the now-inapplicable Phase3B CI entrypoints following the
# brute-force prototype replacement PR #7. It does not certify Phase3B
# Contentlayer MDX, OIDC, backend authorization or real learner state.
jobs:
  prototype-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check bounded prototype source, catalog, and mock-auth contracts
        run: node --test tests/prototype-contract.test.mjs

  frontend-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact prototype dependency lockfile
        run: npm ci --no-audit --no-fund
      - name: Typecheck prototype
        run: npx tsc --noEmit
      - name: Compile exported prototype
        run: npm run build
      - name: Verify bounded prototype public routes
        run: node scripts/verify-prototype-export.mjs
